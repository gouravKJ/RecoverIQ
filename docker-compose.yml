services:
  postgres:
    image: postgres:15-alpine
    container_name: recoveriq-postgres
    environment:
      POSTGRES_USER: recoveriq
      POSTGRES_PASSWORD: recoveriq
      POSTGRES_DB: recoveriq
    ports:
      - "5432:5432"
    volumes:
      - recoveriq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recoveriq -d recoveriq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  recoveriq_pgdata:
